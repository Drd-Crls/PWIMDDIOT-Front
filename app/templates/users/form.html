{% extends "base.html" %}
{% block title %}Novo usuário{% endblock %}
{% block content %}
<h1>Novo usuário</h1>
<p class="muted">A API exige autenticação para criar usuários — esta tela serve para um usuário logado cadastrar outros.</p>
<div class="card form-card">
  <form method="post">
    <label>Nome
      <input name="name" required>
    </label>
    <label>E-mail
      <input name="email" type="email" required>
    </label>
    <label>Senha
      <input name="password" type="password" required>
    </label>
    <label>Papel
      <select name="role">
        {% for r in roles %}
          <option value="{{ r }}">{{ r }}</option>
        {% endfor %}
      </select>
    </label>
    <button class="btn btn-primary" type="submit">Criar</button>
    <a class="btn btn-secondary" href="{{ url_for('dashboard.index') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
