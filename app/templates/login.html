{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card login-card">
  <h1>Entrar</h1>
  <form method="post">
    <label>E-mail
      <input type="email" name="email" required autofocus>
    </label>
    <label>Senha
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn btn-primary">Entrar</button>
  </form>
</div>
{% endblock %}
